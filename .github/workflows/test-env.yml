name: Test Environment Paths
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Print Environment Variables
        run: |
          echo "DEVKITPRO: $DEVKITPRO"
          echo "DEVKITARM: $DEVKITARM"
          echo "PATH: $PATH"
          
      - name: Locate Toolchain and Libraries
        run: |
          echo "--- Finding GCC ---"
          find / -name "arm-none-eabi-gcc" 2>/dev/null
          echo "--- Finding tonc.h ---"
          find / -name "tonc.h" 2>/dev/null
          echo "--- Finding libtonc.a ---"
          find / -name "libtonc.a" 2>/dev/null
          
      - name: List devkitpro directories
        run: |
          ls -la /opt/devkitpro 2>/dev/null || echo "No /opt/devkitpro"
